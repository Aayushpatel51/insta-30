<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 31: Automated Meeting Minutes Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .code-font { font-family: 'Fira Code', monospace; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .task-appear { animation: slideIn 0.5s ease-out forwards; opacity: 0; }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen overflow-hidden">

    <!-- Header -->
    <header class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">M</div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Meeting<span class="text-blue-500">Flow</span></h1>
                <p class="text-xs text-slate-400 font-medium">SENIOR ENGINEER CHALLENGE: DAY 31</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 px-3 py-1 bg-slate-800 rounded-full text-xs font-medium border border-slate-700">
                <span class="w-2 h-2 bg-green-500 rounded-full status-pulse"></span>
                <span>SYSTEM ACTIVE</span>
            </div>
            <button class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all">
                Export to Notion
            </button>
        </div>
    </header>

    <main class="grid grid-cols-12 gap-6 h-[calc(100vh-160px)]">

        <!-- Left: Live Transcription -->
        <div class="col-span-12 lg:col-span-4 flex flex-col h-full">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-microphone text-blue-500"></i>
                    Live Transcript
                </h2>
                <span class="text-[10px] text-slate-500 code-font">WHISPER-V3-LARGE</span>
            </div>
            <div id="transcript-container" class="glass rounded-xl p-4 overflow-y-auto flex-1 space-y-4 text-sm scroll-smooth">
                <!-- Transcript entries will appear here -->
            </div>
        </div>

        <!-- Right: AI Insight Panel -->
        <div class="col-span-12 lg:col-span-8 grid grid-rows-2 gap-6">

            <!-- AI Summary Card -->
            <div class="glass rounded-xl p-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10">
                    <i class="fa-solid fa-brain text-8xl"></i>
                </div>
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
                    Intelligent Summary
                </h2>
                <div id="summary-content" class="text-slate-300 leading-relaxed max-w-2xl">
                    <div class="h-4 w-3/4 bg-slate-700 rounded animate-pulse mb-2"></div>
                    <div class="h-4 w-full bg-slate-700 rounded animate-pulse mb-2"></div>
                    <div class="h-4 w-1/2 bg-slate-700 rounded animate-pulse"></div>
                </div>
            </div>

            <!-- Action Items Card -->
            <div class="glass rounded-xl p-6">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-emerald-400"></i>
                    Action Items Extracted
                </h2>
                <div id="task-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Tasks will appear here -->
                </div>
            </div>

        </div>
    </main>

    <!-- Overlay: Technical Context for Instagram -->
    <div class="fixed bottom-8 right-8 max-w-xs glass p-4 rounded-xl shadow-2xl border-blue-500/30">
        <div class="flex items-start gap-3">
            <i class="fa-solid fa-code text-blue-400 mt-1"></i>
            <div>
                <h3 class="font-semibold text-sm">Architecture Note</h3>
                <p class="text-[11px] text-slate-400 mt-1 leading-normal">
                    Implementing <span class="text-blue-300">Speaker Diarization</span> via RZ-Audio Embeddings and GPT-4o context mapping. Reduces workload by <span class="text-green-400">80%</span>.
                </p>
            </div>
        </div>
    </div>

    <script>
        const transcriptData = [
            { speaker: "Founder", color: "text-blue-400", avatar: "F", text: "Hi everyone, thanks for joining. We need to finalize the MVP roadmap today." },
            { speaker: "Senior Dev", color: "text-emerald-400", avatar: "S", text: "I've reviewed the architecture. We can definitely get the core API done by Friday." },
            { speaker: "Founder", color: "text-blue-400", avatar: "F", text: "Great. Sarah, can you make sure the landing page is mobile-responsive?" },
            { speaker: "Designer", color: "text-purple-400", avatar: "D", text: "Sure, I'll have the responsive mockups ready by tomorrow morning." },
            { speaker: "Senior Dev", color: "text-emerald-400", avatar: "S", text: "Perfect. I'll setup the CI/CD pipeline this afternoon to streamline deployments." }
        ];

        const summaryText = "The team met to discuss the <b>MVP roadmap</b>. Decision was made to finalize the core API by Friday. Sarah (Designer) is prioritizing <b>mobile responsiveness</b> for the landing page. All deployments will now flow through a new <b>CI/CD pipeline</b> starting today.";

        const tasksData = [
            { task: "Finalize Core API Development", who: "Senior Dev", when: "Friday", color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" },
            { task: "Design Mobile Responsive Landing Page", who: "Designer", when: "Tomorrow", color: "bg-purple-500/10 text-purple-400 border-purple-500/20" },
            { task: "Setup Automated CI/CD Pipeline", who: "Senior Dev", when: "Today", color: "bg-blue-500/10 text-blue-400 border-blue-500/20" }
        ];

        const transcriptContainer = document.getElementById('transcript-container');
        const summaryContainer = document.getElementById('summary-content');
        const taskContainer = document.getElementById('task-container');

        async function startSequence() {
            // 1. Play Transcript
            for (let i = 0; i < transcriptData.length; i++) {
                await new Promise(r => setTimeout(r, 1500));
                const entry = transcriptData[i];
                const div = document.createElement('div');
                div.className = 'flex gap-3 task-appear';
                div.innerHTML = `
                    <div class="w-8 h-8 rounded-full flex-shrink-0 bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs ${entry.color}">${entry.avatar}</div>
                    <div>
                        <div class="font-semibold text-xs mb-1 ${entry.color}">${entry.speaker}</div>
                        <div class="text-slate-400">${entry.text}</div>
                    </div>
                `;
                transcriptContainer.appendChild(div);
                transcriptContainer.scrollTop = transcriptContainer.scrollHeight;
            }

            // 2. Play Summary
            await new Promise(r => setTimeout(r, 1000));
            summaryContainer.innerHTML = '';
            summaryContainer.className = 'text-slate-300 leading-relaxed max-w-2xl task-appear';
            summaryContainer.innerHTML = summaryText;

            // 3. Play Tasks
            for (let i = 0; i < tasksData.length; i++) {
                await new Promise(r => setTimeout(r, 800));
                const task = tasksData[i];
                const div = document.createElement('div');
                div.className = `p-3 rounded-lg border flex flex-col gap-2 task-appear ${task.color}`;
                div.innerHTML = `
                    <div class="text-sm font-semibold">${task.task}</div>
                    <div class="flex justify-between items-center text-[10px] uppercase font-bold opacity-80">
                        <span><i class="fa-solid fa-user mr-1"></i> ${task.who}</span>
                        <span><i class="fa-solid fa-clock mr-1"></i> ${task.when}</span>
                    </div>
                `;
                taskContainer.appendChild(div);
            }
        }

        // Delay start to allow for screen record prep
        setTimeout(startSequence, 2000);
    </script>
</body>
</html>
