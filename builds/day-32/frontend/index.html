<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminFlow | Internal Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .dark { background-color: #0f172a; color: #f8fafc; }
        .dark .bg-card { background-color: #1e293b; border-color: #334155; }
        .dark .bg-sidebar { background-color: #020617; border-color: #1e293b; }
        .bg-card { background-color: #ffffff; border: 1px solid #e2e8f0; }
        .bg-sidebar { background-color: #f8fafc; border-right: 1px solid #e2e8f0; }

        .active-tab {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, rgba(59, 130, 246, 0) 100%);
            border-left: 4px solid #3b82f6;
            color: #3b82f6;
        }
        .toast {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-900 min-h-screen">
    <div id="app" class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-sidebar flex flex-col fixed h-full z-20">
            <div class="p-6 flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fas fa-layer-group text-xl"></i>
                </div>
                <span class="font-bold text-xl tracking-tight">Admin<span class="text-blue-600">Flow</span></span>
            </div>

            <nav class="flex-1 px-4 mt-4 space-y-1">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 ml-2">Mode</div>
                <button onclick="switchMode('builder')" id="btn-builder" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 active-tab">
                    <i class="fas fa-hammer"></i>
                    <span class="font-medium">Builder Mode</span>
                </button>
                <button onclick="switchMode('admin')" id="btn-admin" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-500 hover:bg-slate-100">
                    <i class="fas fa-user-shield"></i>
                    <span class="font-medium">Admin View</span>
                </button>

                <div class="pt-6 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 ml-2">Resources</div>
                <div id="resource-list" class="space-y-1">
                    <!-- Dynamic Resources -->
                </div>
            </nav>

            <div class="p-4 border-t border-slate-200 dark:border-slate-800">
                <div class="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-4">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-blue-600 uppercase">Live Preview</span>
                        <span class="flex h-2 w-2 rounded-full bg-green-500"></span>
                    </div>
                    <p class="text-[10px] text-slate-500 leading-tight">Syncing with internal DB in real-time.</p>
                </div>
                <button onclick="toggleTheme()" class="w-full mt-4 flex items-center justify-center space-x-2 py-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block"></i>
                    <span class="text-sm font-medium">Toggle Theme</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8 transition-all duration-300">
            <!-- Header -->
            <header class="flex justify-between items-center mb-10">
                <div>
                    <h1 id="page-title" class="text-3xl font-extrabold tracking-tight">System Builder</h1>
                    <p id="page-subtitle" class="text-slate-500 mt-1">Configure internal tools without writing code.</p>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2 px-4 py-2 bg-white dark:bg-slate-800 rounded-full border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                        <span class="text-xs font-semibold text-slate-600 dark:text-slate-300">Connected to Prod-DB</span>
                    </div>
                </div>
            </header>

            <!-- Builder View -->
            <div id="view-builder" class="space-y-8">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Resource Config -->
                    <div class="lg:col-span-1 bg-card rounded-2xl p-6 shadow-sm">
                        <h3 class="font-bold text-lg mb-4 flex items-center">
                            <i class="fas fa-cog mr-2 text-blue-500"></i>
                            Select Resource
                        </h3>
                        <div id="schema-selector" class="space-y-3">
                            <!-- Populated via JS -->
                        </div>
                    </div>

                    <!-- Visibility Config -->
                    <div class="lg:col-span-2 bg-card rounded-2xl p-6 shadow-sm">
                        <h3 class="font-bold text-lg mb-4 flex items-center">
                            <i class="fas fa-eye mr-2 text-blue-500"></i>
                            Column Visibility
                        </h3>
                        <div id="field-selector" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </div>

                <div class="bg-card rounded-2xl p-6 shadow-sm overflow-hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-bold text-lg">Builder Preview</h3>
                        <span class="text-xs text-slate-400 italic">Drag and drop to reorder coming soon...</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="border-b border-slate-100 dark:border-slate-800">
                                <tr id="preview-header">
                                    <!-- Populated via JS -->
                                </tr>
                            </thead>
                            <tbody id="preview-body">
                                <!-- Populated via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Admin View -->
            <div id="view-admin" class="hidden space-y-8">
                <div class="flex justify-between items-center">
                    <h2 id="admin-table-title" class="text-2xl font-bold">User Management</h2>
                    <button onclick="openCreateModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-semibold shadow-lg shadow-blue-500/20 transition-all">
                        <i class="fas fa-plus mr-2"></i> Add Record
                    </button>
                </div>

                <div class="bg-card rounded-2xl shadow-xl border-none overflow-hidden">
                    <div class="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
                        <div class="relative w-72">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" placeholder="Filter records..." class="w-full pl-11 pr-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="flex space-x-2">
                            <button class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-slate-500"><i class="fas fa-download"></i></button>
                            <button class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-slate-500"><i class="fas fa-print"></i></button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 dark:bg-slate-800/50">
                                <tr id="admin-header">
                                    <!-- Populated via JS -->
                                </tr>
                            </thead>
                            <tbody id="admin-body">
                                <!-- Populated via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-8 right-8 z-50 flex flex-col space-y-4"></div>

    <script>
        let schema = {};
        let activeTable = 'users';
        let config = {
            users: { visibleFields: ['id', 'name', 'email', 'role', 'status'] },
            products: { visibleFields: ['id', 'name', 'price', 'stock', 'category'] }
        };
        let currentMode = 'builder';

        async function init() {
            try {
                const res = await fetch('http://localhost:8000/api/schema');
                // Mocking for frontend development if backend isn't up
                schema = await res.json().catch(() => ({
                    users: { fields: ['id', 'name', 'email', 'role', 'status'], count: 3 },
                    products: { fields: ['id', 'name', 'price', 'stock', 'category'], count: 2 }
                }));

                renderResourceLists();
                renderBuilder();
                loadTableData();
            } catch (e) {
                console.error("Fetch error, using mocks");
                schema = {
                    users: { fields: ['id', 'name', 'email', 'role', 'status'], count: 3 },
                    products: { fields: ['id', 'name', 'price', 'stock', 'category'], count: 2 }
                };
                renderResourceLists();
                renderBuilder();
            }
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('view-builder').classList.toggle('hidden', mode !== 'builder');
            document.getElementById('view-admin').classList.toggle('hidden', mode !== 'admin');

            document.getElementById('btn-builder').classList.toggle('active-tab', mode === 'builder');
            document.getElementById('btn-builder').classList.toggle('text-slate-500', mode !== 'builder');
            document.getElementById('btn-admin').classList.toggle('active-tab', mode === 'admin');
            document.getElementById('btn-admin').classList.toggle('text-slate-500', mode !== 'admin');

            document.getElementById('page-title').innerText = mode === 'builder' ? 'System Builder' : 'Admin Panel';
            document.getElementById('page-subtitle').innerText = mode === 'builder'
                ? 'Configure internal tools without writing code.'
                : `Managing ${activeTable.charAt(0).toUpperCase() + activeTable.slice(1)}`;

            if (mode === 'admin') loadTableData();
            showToast(`Switched to ${mode.toUpperCase()} mode`);
        }

        function renderResourceLists() {
            const list = document.getElementById('resource-list');
            const selector = document.getElementById('schema-selector');
            list.innerHTML = '';
            selector.innerHTML = '';

            Object.keys(schema).forEach(table => {
                // Sidebar List
                const btn = document.createElement('button');
                btn.className = `w-full flex items-center justify-between px-4 py-2 rounded-lg text-sm transition-colors ${activeTable === table ? 'bg-blue-600/10 text-blue-600 font-bold' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'}`;
                btn.onclick = () => selectResource(table);
                btn.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-table text-[10px]"></i>
                        <span>${table.charAt(0).toUpperCase() + table.slice(1)}</span>
                    </div>
                    <span class="text-[10px] opacity-50">${schema[table].count}</span>
                `;
                list.appendChild(btn);

                // Builder Selector
                const card = document.createElement('button');
                card.className = `w-full p-4 rounded-xl border-2 text-left transition-all ${activeTable === table ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-500/5' : 'border-slate-100 dark:border-slate-800 hover:border-blue-200'}`;
                card.onclick = () => selectResource(table);
                card.innerHTML = `
                    <div class="font-bold text-sm">${table.toUpperCase()}</div>
                    <div class="text-xs text-slate-400">${schema[table].fields.length} Fields available</div>
                `;
                selector.appendChild(card);
            });
        }

        function selectResource(table) {
            activeTable = table;
            renderResourceLists();
            renderBuilder();
            if (currentMode === 'admin') loadTableData();
            showToast(`Selected resource: ${table}`);
        }

        function renderBuilder() {
            const fieldBox = document.getElementById('field-selector');
            fieldBox.innerHTML = '';

            const fields = schema[activeTable].fields;
            fields.forEach(field => {
                const label = document.createElement('label');
                label.className = "flex items-center space-x-3 p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors";
                const checked = config[activeTable].visibleFields.includes(field);
                label.innerHTML = `
                    <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleField('${field}')" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm font-medium">${field}</span>
                `;
                fieldBox.appendChild(label);
            });

            updatePreview();
        }

        function toggleField(field) {
            const idx = config[activeTable].visibleFields.indexOf(field);
            if (idx > -1) {
                config[activeTable].visibleFields.splice(idx, 1);
            } else {
                config[activeTable].visibleFields.push(field);
            }
            updatePreview();
        }

        async function updatePreview() {
            const header = document.getElementById('preview-header');
            const body = document.getElementById('preview-body');
            header.innerHTML = '';
            body.innerHTML = '';

            const visible = config[activeTable].visibleFields;
            visible.forEach(f => {
                header.innerHTML += `<th class="py-4 font-bold text-slate-400 text-xs uppercase tracking-widest">${f}</th>`;
            });

            // Mock preview data
            for (let i = 0; i < 2; i++) {
                let row = `<tr class="border-b border-slate-50 dark:border-slate-800/50">`;
                visible.forEach(f => {
                    row += `<td class="py-4 text-sm font-medium text-slate-600 dark:text-slate-400">Sample ${f}</td>`;
                });
                row += `</tr>`;
                body.innerHTML += row;
            }
        }

        async function loadTableData() {
            const header = document.getElementById('admin-header');
            const body = document.getElementById('admin-body');
            header.innerHTML = '';
            body.innerHTML = '';

            document.getElementById('admin-table-title').innerText = `${activeTable.charAt(0).toUpperCase() + activeTable.slice(1)} Records`;

            const visible = config[activeTable].visibleFields;
            visible.forEach(f => {
                header.innerHTML += `<th class="px-6 py-4 font-bold text-slate-500 text-xs uppercase tracking-wider">${f}</th>`;
            });
            header.innerHTML += `<th class="px-6 py-4 font-bold text-slate-500 text-xs uppercase tracking-wider text-right">Actions</th>`;

            try {
                const res = await fetch(`http://localhost:8000/api/resources/${activeTable}`);
                const data = await res.json();

                data.forEach(record => {
                    let row = `<tr class="border-b border-slate-50 dark:border-slate-800/30 hover:bg-slate-50 dark:hover:bg-slate-800/20 transition-colors">`;
                    visible.forEach(f => {
                        let val = record[f];
                        let badgeClass = "";
                        if (f === 'status') {
                            badgeClass = val === 'Active' ? 'bg-green-100 text-green-700' : val === 'Pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700';
                            val = `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${badgeClass}">${val}</span>`;
                        }
                        row += `<td class="px-6 py-4 text-sm font-medium">${val}</td>`;
                    });
                    row += `
                        <td class="px-6 py-4 text-right">
                            <button class="text-slate-400 hover:text-blue-500 transition-colors mr-3"><i class="fas fa-edit"></i></button>
                            <button class="text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    row += `</tr>`;
                    body.innerHTML += row;
                });
            } catch (e) {
                body.innerHTML = `<tr><td colspan="${visible.length + 1}" class="p-8 text-center text-slate-400 italic">Connect backend to load real data...</td></tr>`;
            }
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "toast bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700";
            toast.innerHTML = `
                <i class="fas fa-check-circle text-green-400"></i>
                <span class="text-sm font-medium">${msg}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        init();
    </script>
</body>
</html>
